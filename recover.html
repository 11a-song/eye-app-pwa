<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>연세제일안과 · 연결 복구</title>
<style>body{margin:0;background:#f5f5f9;color:#404040;font-family:system-ui,sans-serif;line-height:1.8}main{max-width:420px;margin:15vh auto;padding:28px}h1{font-size:24px}p{font-size:16px}button,a{display:block;padding:13px 20px;border:0;border-radius:12px;font:inherit;text-align:center;text-decoration:none;background:#2d83f5;color:#fff;margin-top:18px}small{display:block;color:#7b808b;margin-top:18px}</style>
<main><h1>앱 연결을 복구하고 있습니다.</h1><p id="status" role="status">잠시만 기다려 주세요. 완료되면 홈으로 이동합니다.</p><small>저장된 수술 일정과 약 체크 기록은 삭제하지 않습니다.</small><button id="retry" type="button" hidden>다시 시도</button><a href="./#/">홈으로 이동</a></main>
<script>
(() => {
  let finished = false, timer;
  const status = document.getElementById('status'), retry = document.getElementById('retry');
  function home() { if (finished) return; finished = true; clearTimeout(timer); location.replace('./#/'); }
  function failed() { clearTimeout(timer); status.textContent='인터넷 연결을 확인한 뒤 다시 시도해 주세요.'; retry.hidden=false; }
  async function repair() {
    retry.hidden=true;
    status.textContent='앱 연결을 갱신하고 있습니다. 잠시만 기다려 주세요.';
    if (!('serviceWorker' in navigator)) { home(); return; }
    timer=setTimeout(failed,30000);
    try {
      const registration=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});
      await registration.update();
      const worker=registration.installing || registration.waiting;
      if (!worker) { home(); return; }
      function changed() { if(worker.state==='activated')home(); else if(worker.state==='redundant')failed(); }
      worker.addEventListener('statechange',changed);
      changed();
    } catch { failed(); }
  }
  retry.addEventListener('click',repair);
  repair();
})();
</script>
</html>
