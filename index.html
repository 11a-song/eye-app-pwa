<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F5F5F9">
  <meta name="description" content="연세제일안과 모바일 안내 앱. 병원 이용 안내, 원장별 진료 일정과 진료 전후 안내를 확인하세요.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>연세제일안과 · 모바일 안내</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/app.css">
  <script src="assets/app.js" defer></script>
</head>
<body>
  <section id="install-welcome" class="install-welcome" aria-labelledby="install-welcome-title" hidden>
    <img class="install-welcome-logo" src="assets/logo.svg" alt="연세제일안과" width="224" height="39">
    <div class="install-welcome-content">
      <img class="install-welcome-icon" src="assets/icon-192.png" alt="" width="96" height="96">
      <h1 id="install-welcome-title">연세제일안과를<br>앱으로 만나보세요</h1>
      <p>진료 일정과 수술 안내를 확인하고<br>나의 안약 사용 기록을 관리하세요.</p>
      <ul><li>홈 화면에서 바로 실행</li><li>로그인 없이 약 사용 기록 관리</li></ul>
    </div>
    <div class="install-welcome-actions">
      <p id="install-welcome-note"></p>
      <button type="button" class="primary-button" data-pwa-start>앱 설치하기</button>
      <button type="button" class="install-continue" data-pwa-continue>브라우저로 계속 이용하기</button>
    </div>
  </section>
  <script>
    // Show the first screen from HTML without waiting for the application bundle.
    (() => {
      const mobile = /Android|iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      if (mobile && !standalone) {
        document.getElementById('install-welcome').hidden = false;
        document.documentElement.setAttribute('data-install-welcome', '');
      }
    })();
  </script>
  <div class="app-shell">
    <header class="app-header"><a href="#/" aria-label="연세제일안과 홈"><img src="assets/logo.svg" alt="연세제일안과" width="224" height="39"></a><nav class="header-language" id="header-language" aria-label="언어 선택"></nav></header>
    <main id="main" class="home-view" tabindex="-1"><div class="menu-list"><a class="menu-bar" href="#/guide"><span class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 7h6m-3-3v6m-3 4h1m4 0h1m-6 3h1m4 0h1"/></svg></span><span class="menu-copy"><span class="menu-title">병원 이용 안내</span></span></a><a class="menu-bar" href="#/schedule"><span class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-13 4h2m4 0h2m-8 3h2"/></svg></span><span class="menu-copy"><span class="menu-title">원장별 진료 일정</span></span></a><a class="menu-bar" href="#/before"><span class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="3"/><rect x="9" y="2" width="6" height="4" rx="1"/><path d="m9 13 2 2 4-4"/></svg></span><span class="menu-copy"><span class="menu-title-row"><span class="menu-title">수술 전</span><span class="menu-schedule-badge">스케줄 생성</span></span></span></a><a class="menu-bar" href="#/after"><span class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></span><span class="menu-copy"><span class="menu-title-row"><span class="menu-title">수술 후</span><span class="menu-schedule-badge">스케줄 생성</span></span></span></a><a class="menu-bar" href="#/dream"><span class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="8" rx="9" ry="4"/><path d="M3 8c0 7 4 12 9 12s9-5 9-12"/><path d="M6 9c1.5 1.3 3.6 2 6 2"/></svg></span><span class="menu-copy"><span class="menu-title">드림렌즈</span></span></a><a class="menu-bar" href="#/faq"><span class="menu-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11a9 9 0 0 1-9 9H4l-1 1v-9a9 9 0 1 1 18-1Z"/><path d="M10 8a2 2 0 0 1 4 0c0 2-2 2-2 4m0 3h.01"/></svg></span><span class="menu-copy"><span class="menu-title">FAQ 자주묻는 질문</span></span></a></div></main>
    <nav class="bottom-nav" aria-label="하단 메뉴" id="bottom-nav"><a class="nav-item active" href="#/" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/></svg><span>홈메뉴</span></a><span class="nav-divider" aria-hidden="true">|</span><button class="nav-item contact-nav-item" data-action="contact" aria-haspopup="dialog" aria-controls="contact-dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11a9 9 0 0 1-9 9H6l-4 2 1-6a9 9 0 1 1 18-5Z"/><path d="M8 11h.01m4 0h.01m4 0h.01"/></svg><span>문의</span></button><span class="nav-divider" aria-hidden="true">|</span><a class="nav-item schedule-nav-item" href="#/profile"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-13 4h2m4 0h2m-8 3h2"/></svg><span>수술자 안약 스케줄</span></a></nav>
  </div>
  <dialog id="contact-dialog" class="sheet contact-sheet" aria-labelledby="contact-title"></dialog>
  <dialog id="language-dialog" class="sheet" aria-labelledby="language-title"></dialog>
  <dialog id="install-dialog" class="sheet" aria-labelledby="install-title"></dialog>
  <dialog id="veterans-dialog" class="guide-modal" aria-labelledby="veterans-title"></dialog>
  <dialog id="cataract-record-dialog" class="cataract-record-dialog" aria-labelledby="cataract-record-title" aria-describedby="cataract-record-description">
    <h2 id="cataract-record-title">체크 기록 안내</h2>
    <p id="cataract-record-description"></p>
    <div class="cataract-record-actions"><button type="button" data-cataract-record-choice="cancel" autofocus>취소</button><button id="cataract-record-confirm" type="button" data-cataract-record-choice="confirm">계속</button></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
